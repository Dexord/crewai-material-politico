# Fontes do agente pesquisador.
# Edite livremente: adicione/remova feeds RSS e portais que voce escolher.
# O agente le este arquivo em tempo de execucao (nao precisa reiniciar nada).

search:
  enabled: true
  region: "br-pt"
  max_results: 8

# Limites de leitura dos feeds (usados por ler_rss_ativos e pelo comando pautas).
# limite_por_feed: itens mais recentes lidos de cada feed.
# limite_total: teto de itens no total (0 = sem teto). O corte e "round-robin",
# entao todos os feeds contribuem antes de qualquer um repetir.
rss_cfg:
  limite_por_feed: 5
  limite_total: 60

